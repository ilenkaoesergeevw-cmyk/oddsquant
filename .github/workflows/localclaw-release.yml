name: Build LocalClaw Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "localclaw-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: localclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: pyinstaller localclaw.spec --noconfirm --distpath ../dist-localclaw
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalClaw-windows
          path: dist-localclaw/LocalClaw.exe
      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-localclaw/LocalClaw.exe
