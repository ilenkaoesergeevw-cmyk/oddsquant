name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Smoke test server (dummy key, no real API calls)
        run: |
          MISTRAL_API_KEY=dummy PORT=3123 npm start > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:3123/ && break; sleep 1; done
          curl -sf http://localhost:3123/ | grep -q "Mistral Chat"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3123/api/chat -H "Content-Type: application/json" -d '{"messages":[]}')
          test "$code" = "400"
